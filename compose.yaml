services:
  livestocks:
    build: .
    image: livestocks:latest
    ports:
      - "8080:8080"
    environment:
      LIVESTOCKS_LOG_LEVEL: INFO
      # LIVESTOCKS_REFRESH_INTERVAL: 21600   # seconds between refreshes of one ticker
      # LIVESTOCKS_API_WAIT_SECONDS: 30      # how long the API waits for a first crawl
    volumes:
      # A named volume keeps the right permissions for the container's unprivileged user.
      # To keep the data in ./data instead, use "./data:/data" and make that folder writable by uid 1000.
      - livestocks-data:/data
    restart: unless-stopped

volumes:
  livestocks-data:
