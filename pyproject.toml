[project]
name = "livestocks"
version = "0.1.0"
description = "Analyst forecast dashboard and HTTP API fed by a TradingView crawler"
readme = "README.md"
authors = [
    { name = "Pandu Surya Tantra", email = "pandustantra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "nicegui>=3.17.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "websockets>=17.2",
]

[project.scripts]
livestocks = "livestocks.__main__:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "ASYNC", "PTH", "PERF", "TID", "BLE", "T20", "D"]
# D205/D400/D415 and D105/D107 contradict the project docstring format (three lines of prose, no sections);
# scripts/check_docstrings.py enforces that format instead. RUF001-003 flag the typographic symbols the UI uses on purpose.
ignore = ["D205", "D400", "D415", "D105", "D107", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["livestocks"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["T20"]
# the ui package builds HTML, CSS and JavaScript inside string literals that are not worth splitting
"src/livestocks/ui/**" = ["E501"]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = [
    "src/livestocks/domain",
    "src/livestocks/crawler",
    "src/livestocks/storage",
    "src/livestocks/services",
    "src/livestocks/api",
]

[tool.coverage.run]
source = ["livestocks"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
